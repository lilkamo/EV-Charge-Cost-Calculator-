<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0118">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VOLT // EV Charge Cost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0118;
    --bg-2: #160431;
    --neon-pink: #ff2d95;
    --neon-cyan: #00fff0;
    --neon-yellow: #fff200;
    --neon-violet: #b537f2;
    --grid: rgba(255, 45, 149, 0.15);
    --ink: #f5e9ff;
    --muted: #8b7aa8;
  }

- { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
background: var(–bg);
color: var(–ink);
font-family: ‘Space Mono’, monospace;
min-height: 100vh;
overflow-x: hidden;
}

/* Animated grid floor + scanlines + radial glow */
body::before {
content: “”;
position: fixed;
inset: 0;
background:
radial-gradient(ellipse at 50% 0%, rgba(181, 55, 242, 0.4) 0%, transparent 50%),
radial-gradient(ellipse at 80% 100%, rgba(255, 45, 149, 0.25) 0%, transparent 50%),
linear-gradient(180deg, var(–bg) 0%, var(–bg-2) 100%);
z-index: -2;
}

body::after {
content: “”;
position: fixed;
inset: 0;
background-image:
linear-gradient(var(–grid) 1px, transparent 1px),
linear-gradient(90deg, var(–grid) 1px, transparent 1px);
background-size: 40px 40px;
transform: perspective(500px) rotateX(60deg) translateY(20vh) scale(2);
transform-origin: center top;
mask-image: linear-gradient(180deg, transparent 40%, black 70%);
-webkit-mask-image: linear-gradient(180deg, transparent 40%, black 70%);
z-index: -1;
animation: gridscroll 8s linear infinite;
}

@keyframes gridscroll {
from { background-position: 0 0; }
to { background-position: 0 40px; }
}

.wrap {
max-width: 480px;
margin: 0 auto;
padding: 28px 20px 60px;
position: relative;
}

/* Header */
.header {
text-align: center;
margin-bottom: 32px;
position: relative;
}

.logo {
font-family: ‘Major Mono Display’, monospace;
font-size: 14px;
letter-spacing: 0.4em;
color: var(–neon-cyan);
margin-bottom: 4px;
text-shadow: 0 0 12px var(–neon-cyan);
}

.title {
font-family: ‘VT323’, monospace;
font-size: 56px;
line-height: 1;
letter-spacing: 0.02em;
background: linear-gradient(180deg, var(–neon-yellow) 0%, var(–neon-pink) 100%);
-webkit-background-clip: text;
background-clip: text;
color: transparent;
text-shadow: 0 0 30px rgba(255, 45, 149, 0.5);
position: relative;
}

.title::after {
content: “⚡”;
position: absolute;
top: -8px;
right: 20%;
font-size: 28px;
-webkit-text-fill-color: var(–neon-yellow);
color: var(–neon-yellow);
filter: drop-shadow(0 0 8px var(–neon-yellow));
animation: sparkle 1.4s ease-in-out infinite;
}

@keyframes sparkle {
0%, 100% { transform: scale(1) rotate(-5deg); opacity: 1; }
50% { transform: scale(1.2) rotate(5deg); opacity: 0.7; }
}

.subtitle {
font-size: 11px;
letter-spacing: 0.3em;
color: var(–muted);
margin-top: 6px;
text-transform: uppercase;
}

/* Card */
.card {
background: rgba(22, 4, 49, 0.6);
border: 1px solid rgba(181, 55, 242, 0.3);
border-radius: 4px;
padding: 22px 18px;
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
box-shadow:
0 0 0 1px rgba(0, 255, 240, 0.08) inset,
0 8px 40px rgba(181, 55, 242, 0.15);
position: relative;
}

.card::before {
content: “”;
position: absolute;
top: -1px; left: -1px; right: -1px;
height: 2px;
background: linear-gradient(90deg, transparent, var(–neon-cyan), var(–neon-pink), transparent);
border-radius: 4px 4px 0 0;
}

.field {
margin-bottom: 18px;
}

.field:last-child { margin-bottom: 0; }

label {
display: block;
font-size: 10px;
letter-spacing: 0.2em;
color: var(–neon-cyan);
margin-bottom: 8px;
text-transform: uppercase;
font-weight: 700;
}

label .icon {
display: inline-block;
margin-right: 6px;
filter: drop-shadow(0 0 4px var(–neon-cyan));
}

input, select {
width: 100%;
background: rgba(10, 1, 24, 0.8);
border: 1px solid rgba(255, 45, 149, 0.25);
color: var(–ink);
font-family: ‘Space Mono’, monospace;
font-size: 18px;
padding: 14px 14px;
border-radius: 2px;
outline: none;
transition: all 0.15s ease;
-webkit-appearance: none;
appearance: none;
}

input:focus, select:focus {
border-color: var(–neon-pink);
box-shadow: 0 0 0 1px var(–neon-pink), 0 0 20px rgba(255, 45, 149, 0.3);
}

select {
background-image: url(“data:image/svg+xml;charset=UTF-8,%3csvg xmlns=‘http://www.w3.org/2000/svg’ width=‘12’ height=‘8’ viewBox=‘0 0 12 8’%3e%3cpath fill=’%23ff2d95’ d=‘M6 8L0 0h12z’/%3e%3c/svg%3e”);
background-repeat: no-repeat;
background-position: right 16px center;
padding-right: 40px;
}

/* Two-col split */
.row {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 12px;
}

/* Range slider */
.range-wrap {
position: relative;
margin-top: 4px;
}

.range-vals {
display: flex;
justify-content: space-between;
font-family: ‘VT323’, monospace;
font-size: 24px;
margin-bottom: 8px;
}

.range-vals .from { color: var(–neon-yellow); text-shadow: 0 0 8px var(–neon-yellow); }
.range-vals .to { color: var(–neon-pink); text-shadow: 0 0 8px var(–neon-pink); }
.range-vals .arrow { color: var(–muted); align-self: center; font-size: 16px; }

input[type=“range”] {
-webkit-appearance: none;
appearance: none;
background: transparent;
padding: 0;
height: 8px;
width: 100%;
}
input[type=“range”]::-webkit-slider-runnable-track {
height: 4px;
background: linear-gradient(90deg, var(–neon-yellow), var(–neon-pink));
border-radius: 2px;
}
input[type=“range”]::-moz-range-track {
height: 4px;
background: linear-gradient(90deg, var(–neon-yellow), var(–neon-pink));
border-radius: 2px;
}
input[type=“range”]::-webkit-slider-thumb {
-webkit-appearance: none;
height: 22px;
width: 22px;
border-radius: 50%;
background: var(–ink);
border: 2px solid var(–neon-pink);
margin-top: -9px;
box-shadow: 0 0 12px var(–neon-pink);
cursor: pointer;
}
input[type=“range”]::-moz-range-thumb {
height: 22px;
width: 22px;
border-radius: 50%;
background: var(–ink);
border: 2px solid var(–neon-pink);
box-shadow: 0 0 12px var(–neon-pink);
cursor: pointer;
}

.slider-row { margin-bottom: 14px; }
.slider-row:last-child { margin-bottom: 0; }
.slider-label {
display: flex;
justify-content: space-between;
align-items: baseline;
margin-bottom: 6px;
}
.slider-label .name {
font-size: 10px;
letter-spacing: 0.2em;
color: var(–muted);
text-transform: uppercase;
}

/* Result panel */
.result {
margin-top: 24px;
border: 1px solid var(–neon-pink);
border-radius: 4px;
padding: 24px 18px;
background:
linear-gradient(135deg, rgba(255, 45, 149, 0.08), rgba(0, 255, 240, 0.04));
position: relative;
overflow: hidden;
box-shadow: 0 0 30px rgba(255, 45, 149, 0.2);
}

.result::before {
content: “// TOTAL”;
position: absolute;
top: 8px;
left: 12px;
font-size: 10px;
color: var(–muted);
letter-spacing: 0.2em;
}

.result::after {
content: “▮”;
position: absolute;
top: 8px;
right: 12px;
color: var(–neon-cyan);
animation: blink 1s steps(2) infinite;
font-size: 10px;
}

@keyframes blink {
50% { opacity: 0; }
}

.cost {
font-family: ‘VT323’, monospace;
font-size: 72px;
line-height: 1;
text-align: center;
color: var(–neon-yellow);
text-shadow:
0 0 10px var(–neon-yellow),
0 0 30px rgba(255, 242, 0, 0.5);
letter-spacing: 0.02em;
margin: 8px 0 4px;
}

.cost .pound {
color: var(–neon-pink);
text-shadow: 0 0 10px var(–neon-pink);
}

.meta {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 6px;
margin-top: 16px;
padding-top: 14px;
border-top: 1px dashed rgba(181, 55, 242, 0.3);
}

.meta-item { text-align: center; }
.meta-item .v {
font-family: ‘VT323’, monospace;
font-size: 22px;
color: var(–neon-cyan);
}
.meta-item .k {
font-size: 9px;
color: var(–muted);
letter-spacing: 0.15em;
text-transform: uppercase;
margin-top: 2px;
}

/* Footer marquee */
.footer {
margin-top: 28px;
text-align: center;
font-family: ‘Major Mono Display’, monospace;
font-size: 10px;
color: var(–muted);
letter-spacing: 0.4em;
}

.footer span { color: var(–neon-pink); }

/* Reveal anim on load */
.card, .header { animation: rise 0.7s ease-out backwards; }
.header { animation-delay: 0s; }
.card { animation-delay: 0.15s; }

@keyframes rise {
from { opacity: 0; transform: translateY(20px); }
to { opacity: 1; transform: translateY(0); }
}

/* Pulse on cost change */
.cost.bump { animation: bump 0.3s ease-out; }
@keyframes bump {
0% { transform: scale(1); }
50% { transform: scale(1.05); }
100% { transform: scale(1); }
}

/* Remove number spinners */
input[type=“number”]::-webkit-inner-spin-button,
input[type=“number”]::-webkit-outer-spin-button {
-webkit-appearance: none;
margin: 0;
}
input[type=“number”] { -moz-appearance: textfield; }
</style>

</head>

      <h1 class="title">CHARGE.COST</h1>
      <div class="subtitle">EV ENERGY CALCULATOR</div>
    </header>

  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const speed = $('speed'), rate = $('rate'), cap = $('capacity');
  const start = $('start'), end = $('end');
  const startVal = $('startVal'), endVal = $('endVal');
  const cost = $('cost'), energy = $('energy'), time = $('time'), perKwh = $('perKwh');

  function formatTime(hours) {
    if (!isFinite(hours) || hours <= 0) return '0m';
    const totalMin = Math.round(hours * 60);
    if (totalMin < 60) return totalMin + 'm';
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return m === 0 ? h + 'h' : h + 'h ' + m + 'm';
  }

  function calc() {
    let s = parseInt(start.value, 10);
    let e = parseInt(end.value, 10);

    // Keep end >= start (fix on the fly)
    if (e < s) {
      // Push the one that wasn't last touched. Simpler: just clamp end up.
      e = s;
      end.value = s;
    }

    startVal.textContent = s;
    endVal.textContent = e;

    const capacity = parseFloat(cap.value) || 0;
    const pence = parseFloat(rate.value) || 0;
    const kw = parseFloat(speed.value) || 0;

    const kwhAdded = capacity * (e - s) / 100;
    const totalPence = kwhAdded * pence;
    const totalPounds = totalPence / 100;

    // AC charging is typically ~90% efficient, DC fast charging ~93-95%.
    // We'll use a simple linear estimate (real world tapers above 80%).
    const hours = kw > 0 ? kwhAdded / kw : 0;

    cost.innerHTML = '<span class="pound">£</span>' + totalPounds.toFixed(2);
    energy.textContent = kwhAdded.toFixed(1);
    time.textContent = formatTime(hours);
    perKwh.textContent = pence.toFixed(1) + 'p';

    // Bump animation
    cost.classList.remove('bump');
    void cost.offsetWidth;
    cost.classList.add('bump');
  }

  // Make end track start so end can't go below start
  start.addEventListener('input', () => {
    if (parseInt(start.value, 10) > parseInt(end.value, 10)) {
      end.value = start.value;
    }
    calc();
  });
  end.addEventListener('input', () => {
    if (parseInt(end.value, 10) < parseInt(start.value, 10)) {
      start.value = end.value;
      // also update displayed start
    }
    calc();
  });

  [speed, rate, cap].forEach(el => el.addEventListener('input', calc));

  calc();
</script>
